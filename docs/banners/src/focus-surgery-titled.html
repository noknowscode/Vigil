<!doctype html>
<html><head><meta charset="utf-8"><title>focus-surgery-titled</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Optional titled variant of focus-surgery: the sample's display name in the app's display serif (Newsreader, the
     face of Today's greeting and the patient names, here the app's own NewsreaderT20 file), OnSurface #1B212F on the
     morning wash. The panel drops to make room; the blurred page sits lower so nothing competes with the name. */
  .behind { position: absolute; left: -158px; top: 70px; width: 1300px; filter: blur(7px) saturate(.9); opacity: .5;
    -webkit-mask-image: radial-gradient(70% 70% at 50% 62%, #000 30%, transparent 85%); }
  .behind img { width: 100%; }
  .shadow { position: absolute; left: 150px; top: 440px; width: 900px; height: 130px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(28,58,43,.30), rgba(28,58,43,0)); filter: blur(18px); }
  .panel { position: absolute; left: 90px; top: 196px; width: 1020px; height: 324.7px; border-radius: 22px; overflow: hidden;
    transform: perspective(2400px) rotateY(-6deg) rotateX(5deg); transform-origin: 50% 50%;
    box-shadow: 0 0 0 1px rgba(27,33,47,.05), 0 2px 4px rgba(27,33,47,.05), 0 22px 44px -14px rgba(27,33,47,.22),
                0 60px 90px -36px rgba(28,58,43,.40); }
  .panel img { position: absolute; width: calc(1440px * var(--s)); left: calc(-297px * var(--s)); top: calc(-155px * var(--s)); }
  .panel { --s: calc(1020 / 1090); }
  h1 { position: absolute; left: 96px; top: 52px; margin: 0; font: 400 84px/1 'Vigil Serif', serif; letter-spacing: -0.01em;
    color: #1B212F; }
</style></head>
<body><div class="stage bg-morning grain">
  <div class="behind"><img src="cap/light-desk-today@2x.png"></div>
  <div class="shadow"></div>
  <div class="panel"><img src="cap/light-desk-today@2x.png"></div>
  <h1>Vigil</h1>
</div></body></html>
